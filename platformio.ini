; Freckles AI firmware - PlatformIO build (alternative to the Arduino IDE)
; Uses the pioarduino platform, which ships Arduino-ESP32 3.x.
[platformio]
src_dir = Freckles

[env:freckles]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    https://github.com/m5stack/StackChan-BSP.git#1.1.0
    m5stack/M5Unified@^0.2.26
    m5stack/M5GFX@^0.2.33
    crankyoldgit/IRremoteESP8266
    https://github.com/m5stack/M5Unit-NFC.git
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson@^7.4.2
